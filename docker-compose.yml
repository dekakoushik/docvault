services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=docvault_superadmin_secret_key_2026_production_ready
      - DEFAULT_ADMIN_EMAIL=ithelpdesk@plystory.com
      - DEFAULT_ADMIN_PASSWORD=Admin@2026
      - DEFAULT_ADMIN_NAME=Super Administrator
      - DEFAULT_ADMIN_PHONE=9876543210
      - DATA_DIR=/app/database
      - UPLOADS_DIR=/app/uploads
      - AGENT_DIR=/app/.agent
    volumes:
      - docvault_db:/app/database
      - docvault_uploads:/app/uploads
      - docvault_agent:/app/.agent
    expose:
      - "5000"
    networks:
      - docvault-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docvault-net

volumes:
  docvault_db:
  docvault_uploads:
  docvault_agent:

networks:
  docvault-net:
    driver: bridge
